<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  <title>תורנות אזעקות - מדגרת מולדת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-800 text-white min-h-screen">
  <div id="app"></div>

  <script>
    // ========== נתונים קבועים ==========
    const EMPLOYEES = {
      2: { name: 'פריד', number: 2 },
      3: { name: 'גיל', number: 3 },
      4: { name: 'מוחמד', number: 4 },
      5: { name: 'דניאל', number: 5 },
      6: { name: 'מאור', number: 6 }
    };

    const TARGET_PHONE = '0546687696';
    const CYCLE_START_DATE = new Date('2026-01-04');

    // תורן יומי א'-ה' (SMS 1)
    const DAILY_SCHEDULE = { 
      0: 4, // ראשון - מוחמד
      1: 5, // שני - דניאל
      2: 6, // שלישי - מאור
      3: 3, // רביעי - גיל
      4: 2  // חמישי - פריד
    };

    // סבב סופ"ש ו'-ש' (SMS 1)
    const WEEKEND_ROTATION = [5, 4, 2, 6]; // דניאל, מוחמד, פריד, מאור

    // גיבוי שבועי (SMS 2)
    const WEEKLY_BACKUP = [6, 5, 4, 2]; // מאור, דניאל, מוחמד, פריד

    const DAYS_HEB = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    const DAYS_SHORT = ["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"];

    // חגים 2026
    const HOLIDAYS_2026 = {
      '2026-03-16': 'פורים', '2026-03-17': 'שושן פורים',
      '2026-03-30': 'עיד אל-פיטר', '2026-03-31': 'עיד אל-פיטר', '2026-04-01': 'עיד אל-פיטר',
      '2026-04-02': 'פסח', '2026-04-03': 'פסח', '2026-04-04': 'פסח', '2026-04-05': 'פסח',
      '2026-04-06': 'פסח', '2026-04-07': 'פסח', '2026-04-08': 'פסח',
      '2026-04-22': 'יום העצמאות', '2026-05-21': 'שבועות',
      '2026-06-06': 'עיד אל-אדחא', '2026-06-07': 'עיד אל-אדחא', '2026-06-08': 'עיד אל-אדחא', '2026-06-09': 'עיד אל-אדחא',
      '2026-09-12': 'ראש השנה', '2026-09-13': 'ראש השנה', '2026-09-21': 'יום כיפור',
      '2026-09-26': 'סוכות', '2026-09-27': 'סוכות', '2026-09-28': 'סוכות', '2026-09-29': 'סוכות',
      '2026-09-30': 'סוכות', '2026-10-01': 'סוכות', '2026-10-02': 'סוכות', '2026-10-03': 'שמחת תורה',
      '2026-12-26': 'חנוכה', '2026-12-27': 'חנוכה', '2026-12-28': 'חנוכה',
      '2026-12-29': 'חנוכה', '2026-12-30': 'חנוכה', '2026-12-31': 'חנוכה'
    };

    // ========== State ==========
    let state = {
      currentUser: null,
      currentScreen: 'main',
      hasActiveReplacement: false,
      replacementName: null
    };

    // ========== LocalStorage ==========
    function loadState() {
      try {
        const user = localStorage.getItem('alerts_user');
        if (user) state.currentUser = parseInt(user);
        
        const replacement = localStorage.getItem('alerts_replacement');
        if (replacement) {
          const data = JSON.parse(replacement);
          state.hasActiveReplacement = data.active;
          state.replacementName = data.name;
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        if (state.currentUser) localStorage.setItem('alerts_user', state.currentUser);
        localStorage.setItem('alerts_replacement', JSON.stringify({
          active: state.hasActiveReplacement,
          name: state.replacementName
        }));
      } catch (e) {}
    }

    // ========== חישוב תורנות ==========
    function getWeekNumber(date) {
      const diffDays = Math.floor((date - CYCLE_START_DATE) / (1000 * 60 * 60 * 24));
      let week = Math.floor(diffDays / 7) % 4;
      if (week < 0) week = (week + 4) % 4;
      return week;
    }

    function calculateShift(date) {
      const dayOfWeek = date.getDay();
      const weekNum = getWeekNumber(date);
      
      // SMS 1: תורן יומי
      let sms1;
      if (dayOfWeek >= 0 && dayOfWeek <= 4) {
        sms1 = DAILY_SCHEDULE[dayOfWeek];
      } else {
        sms1 = WEEKEND_ROTATION[weekNum];
      }
      
      // SMS 2: גיבוי שבועי
      const sms2 = WEEKLY_BACKUP[weekNum];
      
      // SMS 3: בקרה - תמיד גיל
      const sms3 = 3;
      
      // מספרים להודעה (ללא כפילויות, ממוינים)
      const numbers = [...new Set([sms1, sms2, sms3])].sort((a, b) => a - b);
      
      return {
        sms1,
        sms2,
        sms3,
        numbers,
        message: '!N' + numbers.join('')
      };
    }

    function formatDate(date) {
      return `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
    }

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function sendSMS(message) {
      window.location.href = `sms:${TARGET_PHONE}?body=${encodeURIComponent(message)}`;
    }

    // ========== רנדור ==========
    function render() {
      const app = document.getElementById('app');
      
      if (!state.currentUser) {
        app.innerHTML = renderUserSelection();
      } else {
        switch (state.currentScreen) {
          case 'main':
            app.innerHTML = renderMainScreen();
            break;
          case 'replacement':
            app.innerHTML = renderReplacementScreen();
            break;
          case 'calendar':
            app.innerHTML = renderCalendarScreen();
            break;
        }
      }
    }

    // מסך 1: בחירת משתמש
    function renderUserSelection() {
      const buttons = Object.values(EMPLOYEES).map(emp => `
        <button onclick="selectUser(${emp.number})" class="w-full py-4 px-6 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all flex items-center justify-between active:scale-[0.98]">
          <span class="font-medium text-lg">${emp.name}</span>
        </button>
      `).join('');

      return `
        <div class="min-h-screen flex flex-col items-center justify-center p-6">
          <div class="w-full max-w-sm">
            <div class="text-center mb-10">
              <div class="text-6xl mb-4">🔔</div>
              <h1 class="text-2xl font-bold mb-2">תורנות אזעקות</h1>
              <p class="text-slate-400">מדגרת מולדת</p>
            </div>
            
            <p class="text-center text-slate-300 mb-4">בחר את שמך:</p>
            <div class="space-y-3">
              ${buttons}
            </div>
          </div>
        </div>
      `;
    }

    // מסך 2: ראשי
    function renderMainScreen() {
      const today = new Date();
      const shift = calculateShift(today);
      
      const torenName = EMPLOYEES[shift.sms1]?.name;
      const gibuyName = EMPLOYEES[shift.sms2]?.name;

      return `
        <div class="min-h-screen flex flex-col p-6">
          
          <!-- תאריך -->
          <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-slate-700 px-5 py-2 rounded-full">
              <span>📅</span>
              <span>יום ${DAYS_HEB[today.getDay()]}, ${formatDate(today)}</span>
            </div>
          </div>

          <!-- תורנות -->
          <div class="bg-slate-700 rounded-2xl p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-300">אזעקות תורן יופעלו אצל:</h2>
            
            <div class="space-y-3">
              <div class="flex justify-between items-center py-3 px-4 bg-slate-600 rounded-xl">
                <span class="text-slate-400">תורן:</span>
                <span class="font-bold text-xl">${torenName}</span>
              </div>
              <div class="flex justify-between items-center py-3 px-4 bg-slate-600 rounded-xl">
                <span class="text-slate-400">גיבוי:</span>
                <span class="font-bold text-xl">${gibuyName}</span>
              </div>
            </div>
          </div>

          <!-- כפתור הפעלה -->
          <button onclick="handleActivate()" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-2xl font-bold text-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-6">
            <span>📤</span>
            הפעל אצלי אזעקות
          </button>

          <!-- ניווט -->
          <div class="mt-auto flex gap-4">
            <button onclick="navigate('replacement')" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl font-medium flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
              <span>🔄</span>
              החלפות
            </button>
            <button onclick="navigate('calendar')" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl font-medium flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
              <span>📅</span>
              לוח שנה
            </button>
          </div>

        </div>
      `;
    }

    // מסך 3: החלפות
    function renderReplacementScreen() {
      if (state.hasActiveReplacement) {
        // מצב B: יש החלפה פעילה
        return `
          <div class="min-h-screen flex flex-col p-6">
            
            <h1 class="text-xl font-bold text-center mb-8">🔄 החלפות</h1>
            
            <div class="bg-slate-700 rounded-2xl p-6 mb-6">
              <p class="text-slate-300 mb-2">סטטוס:</p>
              <p class="text-xl font-bold">מוחלף ע"י ${state.replacementName}</p>
            </div>
            
            <button onclick="handleReturnToShift()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-2xl font-bold text-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
              <span>↩️</span>
              חזרתי לתורנות
            </button>
            
            <div class="mt-auto">
              <button onclick="navigate('main')" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl font-medium active:scale-[0.98] transition-all">
                ← חזרה
              </button>
            </div>

          </div>
        `;
      } else {
        // מצב A: אין החלפה
        const buttons = Object.values(EMPLOYEES)
          .filter(emp => emp.number !== state.currentUser && emp.number !== 3)
          .map(emp => `
            <button onclick="handleSelectReplacement(${emp.number})" class="w-full py-4 px-6 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all flex items-center justify-between active:scale-[0.98]">
              <span class="font-medium text-lg">${emp.name}</span>
            </button>
          `).join('');

        return `
          <div class="min-h-screen flex flex-col p-6">
            
            <h1 class="text-xl font-bold text-center mb-8">🔄 החלפות</h1>
            
            <p class="text-slate-300 mb-4">צריך מחליף? בחר מהרשימה:</p>
            
            <div class="space-y-3 mb-6">
              ${buttons}
            </div>
            
            <div class="mt-auto">
              <button onclick="navigate('main')" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl font-medium active:scale-[0.98] transition-all">
                ← חזרה
              </button>
            </div>

          </div>
        `;
      }
    }

    // מסך 4: לוח שנה
    function renderCalendarScreen() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      
      const monthName = today.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
      
      let daysHtml = '';
      
      // ימים ריקים
      for (let i = 0; i < firstDay.getDay(); i++) {
        daysHtml += '<div></div>';
      }
      
      // ימי החודש
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(year, month, d);
        const shift = calculateShift(date);
        const isToday = date.toDateString() === today.toDateString();
        const isWeekend = date.getDay() === 5 || date.getDay() === 6;
        const holiday = HOLIDAYS_2026[formatDateKey(date)];
        
        let bgClass = 'bg-slate-700';
        if (isWeekend) bgClass = 'bg-purple-900/50';
        if (holiday) bgClass = 'bg-emerald-900/50';
        if (isToday) bgClass = 'bg-amber-500';
        
        const textClass = isToday ? 'text-slate-900' : 'text-white';
        const subTextClass = isToday ? 'text-slate-700' : 'text-slate-400';
        
        const torenName = EMPLOYEES[shift.sms1]?.name.slice(0, 3);
        const gibuyName = EMPLOYEES[shift.sms2]?.name.slice(0, 3);
        
        daysHtml += `
          <div class="flex flex-col gap-0.5">
            <div class="${bgClass} rounded-t-lg flex flex-col items-center justify-center py-1 px-0.5">
              <span class="font-bold text-sm ${textClass}">${d}</span>
              <span class="text-[9px] ${subTextClass}">${torenName}</span>
            </div>
            <div class="bg-slate-600 rounded-b-lg flex items-center justify-center py-0.5">
              <span class="text-[8px] text-slate-300">${gibuyName}</span>
            </div>
          </div>
        `;
      }

      return `
        <div class="min-h-screen flex flex-col p-6">
          
          <h1 class="text-xl font-bold text-center mb-6">📅 ${monthName}</h1>
          
          <!-- כותרות ימים -->
          <div class="grid grid-cols-7 gap-1 mb-2">
            ${DAYS_SHORT.map(d => `<div class="text-center text-slate-500 text-sm py-1">${d}</div>`).join('')}
          </div>
          
          <!-- ימים -->
          <div class="grid grid-cols-7 gap-1 mb-6">
            ${daysHtml}
          </div>
          
          <!-- מקרא -->
          <div class="bg-slate-700 rounded-xl p-4 mb-4 text-sm">
            <div class="flex justify-between">
              <!-- צד ימין: צבעי ימים -->
              <div class="space-y-2">
                <div class="flex items-center gap-2">
                  <div class="w-4 h-4 bg-purple-900/50 rounded"></div>
                  <span class="text-slate-300">שישי-שבת</span>
                </div>
                <div class="flex items-center gap-2">
                  <div class="w-4 h-4 bg-emerald-900/50 rounded"></div>
                  <span class="text-slate-300">חג</span>
                </div>
                <div class="flex items-center gap-2">
                  <div class="w-4 h-4 bg-amber-500 rounded"></div>
                  <span class="text-slate-300">היום</span>
                </div>
              </div>
              <!-- צד שמאל: סוגי מלבנים -->
              <div class="space-y-2">
                <div class="flex items-center gap-2">
                  <div class="w-6 h-5 bg-slate-600 rounded"></div>
                  <span class="text-slate-300">תורן</span>
                </div>
                <div class="flex items-center gap-2">
                  <div class="w-6 h-3 bg-slate-500 rounded"></div>
                  <span class="text-slate-300">גיבוי</span>
                </div>
              </div>
            </div>
          </div>
          
          <!-- הערת אחזקה -->
          <div class="bg-slate-700 rounded-xl p-4 mb-6">
            <p class="text-slate-300">🔧 תקלות אחזקה דחופות: <span class="font-bold text-white">מאור</span></p>
          </div>
          
          <div class="mt-auto">
            <button onclick="navigate('main')" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl font-medium active:scale-[0.98] transition-all">
              ← חזרה
            </button>
          </div>

        </div>
      `;
    }

    // ========== Event Handlers ==========
    function selectUser(num) {
      state.currentUser = num;
      saveState();
      render();
    }

    function navigate(screen) {
      state.currentScreen = screen;
      render();
    }

    function handleActivate() {
      const shift = calculateShift(new Date());
      sendSMS(shift.message);
    }

    function handleSelectReplacement(replacementNum) {
      const shift = calculateShift(new Date());
      const newNumbers = [...new Set([...shift.numbers.filter(n => n !== state.currentUser), replacementNum])].sort((a, b) => a - b);
      const message = '!N' + newNumbers.join('');
      
      state.hasActiveReplacement = true;
      state.replacementName = EMPLOYEES[replacementNum].name;
      saveState();
      
      sendSMS(message);
      navigate('main');
    }

    function handleReturnToShift() {
      const shift = calculateShift(new Date());
      
      state.hasActiveReplacement = false;
      state.replacementName = null;
      saveState();
      
      sendSMS(shift.message);
      navigate('main');
    }

    // ========== אתחול ==========
    loadState();
    render();
  </script>
</body>
</html>
